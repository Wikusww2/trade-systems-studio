name: Enterprise CI Pipeline & Test Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-test-matrix:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        working-directory: backend-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate synthetic test fixtures
        working-directory: backend-engine
        run: |
          python -c "from app.services.fixture_generator import generate_all_nightmares; generate_all_nightmares()"

      - name: Run automated pytest test suites
        working-directory: backend-engine
        run: |
          pytest -v --cov=app --cov-report=term-missing

      - name: Execute two-tier concurrency benchmark
        working-directory: backend-engine
        run: |
          python benchmark.py

  lint-and-governance:
    name: Anti-Slop, Lint, Security Audit & Type Governance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify zero em-dash violations
        run: python scripts/check_em_dashes.py

      - name: Verify dual-surface OKLCH typography and ergonomics tokens
        run: python scripts/check_typography_tokens.py

      - name: Install dependencies
        working-directory: backend-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify live pytest metrics match docs and UI
        run: python scripts/sync_metrics.py --check

      - name: Run ruff lint check (backend + scripts)
        working-directory: backend-engine
        run: ruff check . ../scripts

      - name: Run mypy typecheck
        working-directory: backend-engine
        run: mypy app

      - name: Audit Python production dependencies (pip-audit)
        working-directory: backend-engine
        run: pip-audit -r requirements.txt

      - name: Verify nightmare fixtures are byte-deterministic
        working-directory: backend-engine
        run: |
          python -c "from app.services.fixture_generator import generate_all_nightmares; generate_all_nightmares()"
          git diff --exit-code -- app/data/nightmares/

  frontend-typecheck-and-build:
    name: Frontend ESLint, Security Audit, Build & Full-Stack E2E (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: frontend-dashboard
        run: npm ci

      - name: Audit production npm dependencies (zero high/critical)
        working-directory: frontend-dashboard
        run: npm audit --omit=dev --audit-level=high

      - name: Run ESLint check
        working-directory: frontend-dashboard
        run: npm run lint

      - name: Run TypeScript typecheck (strict mode)
        working-directory: frontend-dashboard
        run: npx tsc --noEmit

      - name: Run Next.js production static export build (offline root path for E2E)
        working-directory: frontend-dashboard
        env:
          NEXT_PUBLIC_OFFLINE_MODE: "true"
        run: npm run build

      - name: Set up Python & Playwright Chromium for E2E smoke gates
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend runtime + Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-engine/requirements.txt playwright
          python -m playwright install chromium

      - name: Run desktop & mobile offline Playwright E2E smoke check
        run: python scripts/run_e2e_playwright.py

      - name: Build Next.js for live full-stack E2E (API at 127.0.0.1:8012)
        working-directory: frontend-dashboard
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8012
        run: npm run build

      - name: Run live full-stack FastAPI + Next.js Playwright E2E check
        env:
          E2E_BACKEND_PORT: "8012"
        run: python scripts/run_fullstack_e2e.py

      - name: Verify GitHub Pages basePath static export build
        working-directory: frontend-dashboard
        env:
          NEXT_PUBLIC_BASE_PATH: /trade-systems-studio
        run: npm run build
