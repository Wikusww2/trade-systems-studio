services:
  - type: web
    name: tradetech-backend-engine
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pytest -v
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    plan: free
    autoDeploy: true
